pipeline:
  seed: 42

  src_lang: null
  tgt_lang: null

  preprocess_pipeline_dir: training/${.src_lang}-${.tgt_lang}/preprocess

  # We set the "raw" data dir to the output of the preprocess pipeline
  raw_data_dir: ${.preprocess_pipeline_dir}/gather.${.src_lang}-${.tgt_lang}/output

  valid_data_dir: ${.preprocess_pipeline_dir}/valid.${.src_lang}-${.tgt_lang}/output
  test_data_dir: ${.preprocess_pipeline_dir}/test.${.src_lang}-${.tgt_lang}/output

  valid_dataset: flores200.dev.${.src_lang}-${.tgt_lang}

  marian_dir: null
  marian_config: training/config/marian.train.teacher.base.yml
  opustrainer_config: null

  max_epochs: null
  vocab_size: 64000

  pipeline_dir: training/${.src_lang}-${.tgt_lang}/train.base
  steps:
    # Load Datasets
    - step: raw
      step_label: gather.${pipeline.src_lang}-${pipeline.tgt_lang}
    - step: raw
      step_label: valid.${pipeline.src_lang}-${pipeline.tgt_lang}
      raw_data_dir: ${pipeline.valid_data_dir}
    - step: raw
      step_label: test.${pipeline.src_lang}-${pipeline.tgt_lang}
      raw_data_dir: ${pipeline.test_data_dir}

    # Train
    - step: generate_vocab
      step_label: generate_vocab.${pipeline.src_lang}-${pipeline.tgt_lang}
      corpus_step: gather.${pipeline.src_lang}-${pipeline.tgt_lang}
    - step: train_model
      step_label: train_model.${pipeline.src_lang}-${pipeline.tgt_lang}
      vocab_step: generate_vocab.${pipeline.src_lang}-${pipeline.tgt_lang}
      train_corpus_step: gather.${pipeline.src_lang}-${pipeline.tgt_lang}
      valid_corpus_step: valid.${pipeline.src_lang}-${pipeline.tgt_lang}
      train_categories:
        - "clean"
      train_category_ratios:
        - 1.0
    - step: train_model
      step_label: train_model.${pipeline.tgt_lang}-${pipeline.src_lang}
      src_lang: ${pipeline.tgt_lang}
      tgt_lang: ${pipeline.src_lang}
      vocab_step: generate_vocab.${pipeline.src_lang}-${pipeline.tgt_lang}
      train_corpus_step: gather.${pipeline.src_lang}-${pipeline.tgt_lang}
      valid_corpus_step: valid.${pipeline.src_lang}-${pipeline.tgt_lang}
      train_categories:
        - "clean"
      train_category_ratios:
        - 1.0

    # Eval
    - step: translate
      step_label: translate_test.${pipeline.src_lang}-${pipeline.tgt_lang}
      prev_corpus_step: test.${pipeline.src_lang}-${pipeline.tgt_lang}
      model_step: train_model.${pipeline.src_lang}-${pipeline.tgt_lang}
    - step: evaluate
      step_label: evaluate_test.${pipeline.src_lang}-${pipeline.tgt_lang}
      translated_corpus_step: translate_test.${pipeline.src_lang}-${pipeline.tgt_lang}
      reference_corpus_step: test.${pipeline.src_lang}-${pipeline.tgt_lang}
    - step: translate
      step_label: translate_test.${pipeline.tgt_lang}-${pipeline.src_lang}
      src_lang: ${pipeline.tgt_lang}
      tgt_lang: ${pipeline.src_lang}
      prev_corpus_step: test.${pipeline.src_lang}-${pipeline.tgt_lang}
      model_step: train_model.${pipeline.tgt_lang}-${pipeline.src_lang}
    - step: evaluate
      step_label: evaluate_test.${pipeline.tgt_lang}-${pipeline.src_lang}
      translated_corpus_step: translate_test.${pipeline.tgt_lang}-${pipeline.src_lang}
      reference_corpus_step: test.${pipeline.src_lang}-${pipeline.tgt_lang}

  targets:
    - evaluate_test.${pipeline.src_lang}-${pipeline.tgt_lang}
    - evaluate_test.${pipeline.tgt_lang}-${pipeline.src_lang}
