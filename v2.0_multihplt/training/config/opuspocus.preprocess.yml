pipeline:
  seed: 42
  src_lang: null
  tgt_lang: null

  data_root_dir: data/${.src_lang}-${.tgt_lang}
  raw_data_dir: ${.data_root_dir}/raw

  valid_data_dir: ${.data_root_dir}/valid
  test_data_dir: ${.data_root_dir}/test

  decontaminate_min_length: 25

  pipeline_dir: training/${.src_lang}-${.tgt_lang}/preprocess
  steps:
    # Load Datasets
    - step: raw
      step_label: raw.${pipeline.src_lang}-${pipeline.tgt_lang}
    - step: raw
      step_label: valid.${pipeline.src_lang}-${pipeline.tgt_lang}
      raw_data_dir: ${pipeline.valid_data_dir}
      compressed: false
    - step: raw
      step_label: test.${pipeline.src_lang}-${pipeline.tgt_lang}
      raw_data_dir: ${pipeline.test_data_dir}
      compressed: false

    # Preprocessing
    - step: decontaminate
      step_label: decontaminate.${pipeline.src_lang}-${pipeline.tgt_lang}
      prev_corpus_step: raw.${pipeline.src_lang}-${pipeline.tgt_lang}
      valid_data_step: valid.${pipeline.src_lang}-${pipeline.tgt_lang}
      test_data_step: test.${pipeline.src_lang}-${pipeline.tgt_lang}
      min_length: ${pipeline.decontaminate_min_length}
    - step: gather
      step_label: gather.${pipeline.src_lang}-${pipeline.tgt_lang}
      prev_corpus_step: decontaminate.${pipeline.src_lang}-${pipeline.tgt_lang}

  targets:
    - gather.${pipeline.src_lang}-${pipeline.tgt_lang}
    - valid.${pipeline.src_lang}-${pipeline.tgt_lang}
    - test.${pipeline.src_lang}-${pipeline.tgt_lang}
